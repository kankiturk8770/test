<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96">
  <!-- a four-engine military cargo plane, side view, nose to the left (our own drawing, PUBG's drop-plane look) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b9196"/><stop offset=".45" stop-color="#5d6469"/><stop offset="1" stop-color="#2c3135"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa0a4"/><stop offset="1" stop-color="#454b50"/></linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c7378"/><stop offset="1" stop-color="#3a4044"/></linearGradient>
    <radialGradient id="prop"><stop offset="0" stop-color="#d9dde0" stop-opacity=".55"/><stop offset="1" stop-color="#d9dde0" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- tail fin and stabiliser -->
  <path d="M206 50 L226 6 Q230 2 236 4 L240 8 L236 52 Z" fill="url(#fin)"/>
  <path d="M212 48 L252 40 Q257 40 256 44 L250 50 L214 54 Z" fill="#4c5257"/>
  <!-- fuselage with the upswept rear and the rounded nose -->
  <path d="M14 56 Q14 40 36 37 L196 34 Q214 34 228 44 L244 50 Q246 54 240 56 L214 60 Q200 66 180 68 L40 70 Q16 70 14 56 Z" fill="url(#body)"/>
  <!-- cockpit windows and the cargo door line -->
  <path d="M22 46 Q26 40 34 39 L44 39 L42 46 Z" fill="#1d2226"/>
  <path d="M46 40 h7 v5 h-8 z M56 40 h7 v5 h-8 z" fill="#1d2226"/>
  <path d="M30 62 H190" stroke="#262b2f" stroke-width="1" opacity=".6"/>
  <path d="M184 40 Q196 52 204 64" stroke="#262b2f" stroke-width="1.2" fill="none" opacity=".7"/>
  <!-- landing-gear pod -->
  <path d="M86 66 Q90 74 112 74 L136 74 Q150 74 152 66 Z" fill="#3a4044"/>
  <!-- high wing seen edge-on, with four engines under it -->
  <path d="M58 33 L170 31 Q176 31 176 34 L64 37 Q58 37 58 33 Z" fill="url(#wing)"/>
  <g fill="#4b5156">
    <path d="M70 36 h22 q4 0 4 4 v3 q0 3 -4 3 h-20 q-4 0 -4 -3 v-4 q0 -3 2 -3z"/>
    <path d="M100 35 h22 q4 0 4 4 v3 q0 3 -4 3 h-20 q-4 0 -4 -3 v-4 q0 -3 2 -3z"/>
    <path d="M132 34.5 h22 q4 0 4 4 v3 q0 3 -4 3 h-20 q-4 0 -4 -3 v-4 q0 -3 2 -3z"/>
  </g>
  <!-- spinning propellers (blur discs) -->
  <g fill="url(#prop)"><ellipse cx="68" cy="41" rx="3" ry="13"/><ellipse cx="98" cy="40" rx="3" ry="13"/><ellipse cx="130" cy="39.5" rx="3" ry="13"/></g>
  <g fill="#2a2f33"><circle cx="69" cy="41" r="2"/><circle cx="99" cy="40" r="2"/><circle cx="131" cy="39.5" r="2"/></g>
  <!-- a little light on top -->
  <path d="M40 38 L196 35" stroke="#c9ced2" stroke-width="1" opacity=".5"/>
</svg>
